# Server Port Configuration (Dynamic platform PORT with 8080 fallback)
server.port=${PORT:8080}

# PostgreSQL Datasource Configuration
# Reads from environment variables (DATABASE_URL, DATABASE_USERNAME/DATABASE_USER, DATABASE_PASSWORD)
# Falls back to local Docker Compose PostgreSQL instance (localhost:5555)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5555/tasktracker_db}
spring.datasource.username=${DATABASE_USERNAME:${DATABASE_USER:root}}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# CORS Configuration
# Allowed origins can be provided as a comma-separated list via CORS_ALLOWED_ORIGINS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
